<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Echte Freundinnen</title>
<style>
/* Layout: one-screen classroom app for iPad landscape. Top: week strip, whose turn, Lena's heart barometer.
   Middle: the drawn scene. Bottom: big picture cards or arrows. No text the children must read. */
:root{
  --paper:#fdf3cf;
  --paper-deep:#f2dd96;
  --ink:#2c2a1e;
  --ink-soft:#6b6448;
  --leaf:#4f9a3a;
  --leaf-deep:#376c28;
  --heart:#d9384a;
  --lena:#e8a43a;
  --mia:#3a7fc4;
  --card:#fffaf0;
  --good:#3f9b4a;
  --bad:#d14b3c;
  --font-ui: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding-inline:16px;padding-block:8px;box-sizing:border-box;max-width:1400px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:4px solid var(--mia);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap}
.week{display:flex;gap:5px}
.week span{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.95rem;background:var(--card);color:var(--ink-soft);border:3px solid transparent;position:relative}
.week span.now{border-color:var(--leaf);color:var(--ink);transform:scale(1.12)}
.week span.done{background:var(--paper-deep)}
.turn{display:flex;align-items:center;gap:8px;font-size:1.3rem;font-weight:800;margin-left:auto}
.turn svg{width:54px;height:54px;border-radius:50%;border:4px solid var(--ink);background:#fff}
.turn[hidden]{display:none}
.turn.lena svg{border-color:var(--lena)} .turn.mia svg{border-color:var(--mia)}
.turn.pulse svg{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.meter{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:6px 10px}
.meter svg.face{width:40px;height:40px}
.bar{display:flex;gap:3px}
.bar i{width:13px;height:30px;border-radius:4px;background:#e6dcc0;transition:background .5s, transform .5s}
.bar i.on{transform:scaleY(1.05)}
.delta{font-size:1.6rem;min-width:1.6em;text-align:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 12px;font-weight:900;font-size:1.15rem;font-variant-numeric:tabular-nums;min-height:46px;box-sizing:border-box}
.pill svg{width:36px;height:36px;transition:opacity .5s}
.pill.online{color:var(--heart)}
.pill .ar{font-size:1.2rem}
.fr{position:relative;display:inline-flex}
.fr.lost svg{animation:shake .5s 3}
.fr b{position:absolute;left:50%;top:-6px;font-size:1.5rem;transform:translateX(-50%);animation:drop 1.6s ease-out forwards;pointer-events:none}
@keyframes drop{0%{opacity:0;transform:translate(-50%,-14px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.25)}100%{opacity:1;transform:translate(-50%,8px) scale(1)}}
.sortbox{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.htitle{font-size:2rem;font-weight:900;background:#fff6c8;border:3px solid var(--ink);border-radius:14px;padding:4px 18px}
.turn.ayla svg{border-color:#8e5bd6}

/* stage */
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.stage > svg.scene{max-width:100%;max-height:100%;width:auto;height:100%;aspect-ratio:8/5;border-radius:14px;box-shadow:0 4px 18px rgba(60,50,10,.18);background:#fff}
.daycard{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border-radius:24px;padding:28px 60px;box-shadow:0 6px 0 var(--paper-deep)}
.daycard .d{font-size:clamp(4rem,14vw,8rem);font-weight:900;color:var(--leaf);line-height:1}
.daycard .sun{font-size:3rem}
.daycard .full{font-size:1.1rem;color:var(--ink-soft)}

/* bottom */
.bottom{display:flex;align-items:center;justify-content:center;gap:14px;min-height:86px}
.nav{display:flex;justify-content:space-between;width:100%;align-items:center;gap:12px}
.arrow{width:88px;height:74px;border-radius:20px;background:var(--leaf);color:#fff;font-size:2.3rem;font-weight:900;box-shadow:0 4px 0 var(--leaf-deep);flex:none}
.arrow.back{background:var(--paper-deep);color:var(--ink);box-shadow:0 4px 0 #d6c27e}
.arrow:active{transform:translateY(3px);box-shadow:none}
.arrow[disabled]{visibility:hidden}
.restart{font-size:1.8rem;opacity:.5;padding:8px}
.cards{display:flex;gap:14px;justify-content:center;flex:1;min-width:0}
.card{flex:1 1 0;max-width:230px;min-width:0;background:var(--card);border:4px solid var(--paper-deep);border-radius:20px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--paper-deep)}
.card:active{transform:translateY(4px);box-shadow:none}
.card .ic{font-size:2.6rem;line-height:1.15;letter-spacing:2px;white-space:nowrap}
.card .w{font-size:1.1rem;font-weight:800}
.feel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.feel button{font-size:2.4rem;width:68px;height:68px;border-radius:18px;background:var(--card);border:4px solid transparent}
.feel button[aria-pressed="true"]{border-color:var(--leaf);transform:scale(1.1)}
.found{font-size:2rem;letter-spacing:6px}

/* sort activity */
.sortlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(100%,760px);align-content:center}
.cmt{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:10px 12px;border:4px solid transparent;transition:border-color .3s}
.cmt .av{font-size:2.2rem;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:#f3ead0;flex:none;overflow:hidden}
.cmt .av svg{width:52px;height:52px}
.cmt .tx{font-size:2rem;font-weight:800;flex:1;min-width:0}
.cmt .bt{display:flex;gap:6px}
.cmt .bt button{font-size:1.9rem;width:56px;height:56px;border-radius:14px;background:#f3ead0}
.cmt.ok{border-color:var(--good)}
.cmt.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* week review */
.review{background:var(--card);border-radius:20px;padding:16px 20px;width:min(100%,900px);display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:8px 10px;align-items:end}
.review .lab{font-size:2rem;align-self:center}
.review .dn{text-align:center;font-weight:800;color:var(--ink-soft)}
.review .fc svg{width:100%;max-width:70px;display:block;margin:0 auto}
.review .lk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:118px;gap:4px}
.review .lk b{display:block;width:60%;background:var(--heart);border-radius:6px 6px 0 0;opacity:.85}
.review .lk small{font-weight:800;color:var(--heart);font-variant-numeric:tabular-nums}

.startbox{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.startbox h1{font-size:clamp(2.2rem,6vw,4rem);color:var(--leaf);margin:0;text-wrap:balance}
.startbox .pair{font-size:3rem;line-height:1}
.startbox svg{width:min(80vw,420px);height:auto}
.small{font-size:.95rem;color:var(--ink-soft);max-width:52ch;margin:0}

@media (max-width:700px){
  .week span{width:30px;height:30px;font-size:.75rem}
  .bar i{width:8px;height:22px}
  .card .ic{font-size:1.8rem} .card .w{font-size:.85rem}
  .arrow{width:62px;height:58px;font-size:1.8rem}
  .sortlist{grid-template-columns:1fr}
  .feel button{width:48px;height:48px;font-size:1.7rem}
  .review{grid-template-columns:auto repeat(7,minmax(0,1fr));padding:10px;gap:6px}
  .review .lk{height:70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <div class="week" id="week"></div>
    <div class="turn" id="turn" hidden></div>
    <div class="meter" id="meter" title="So geht es Lena"></div>
    <div class="pill" id="real" title="Echte Freundinnen"></div>
    <div class="pill online" id="online" title="Online-Freunde und Likes"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bottom" id="bottom"></div>
</div>

<script>
/* ---------- drawing kit ---------- */
let U=0; const uid=()=>'u'+(++U);
const SKIN={lena:'#f7d2b6',mia:'#8a5636',bella:'#f3cba8',adult:'#e9b998',ayla:'#c68e64'};
const HAIR={lena:'#e8c25a',mia:'#2b1a10',bella:'#8a5a33',adult:'#6b4a2e',ayla:'#1b1b1b'};
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const DAYFULL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const moodOf=h=>h>=8?'happy':h>=6?'smile':h>=4?'neutral':h>=2?'sad':'cry';
const emo=(t,x,y,sz=40)=>`<text x="${x}" y="${y}" font-size="${sz}" text-anchor="middle" dominant-baseline="central">${t}</text>`;

function face(who,mood,filter){
  let g='';const dark=who==='mia'||who==='ayla';const hc=dark?'#1a0f08':'#7a5a2a';
  // eyes
  [-1,1].forEach(sd=>{const ex=22*sd, ey=-4;
    if(mood==='sleep'){g+=`<path d="M${ex-9},${ey} Q${ex},${ey+7} ${ex+9},${ey}" stroke="#2b2118" stroke-width="3" fill="none" stroke-linecap="round"/>`;}
    else if(filter){g+=`<ellipse cx="${ex}" cy="${ey}" rx="14" ry="16" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="${ex}" cy="${ey+1}" r="10" fill="#5aa0e6"/><circle cx="${ex}" cy="${ey+1}" r="5" fill="#1d2b3a"/><circle cx="${ex+4}" cy="${ey-4}" r="3" fill="#fff"/>`;
      [[-10,-14,-16,-22],[-3,-16,-5,-24],[5,-15,7,-23]].forEach(([a,b,c,d])=>{g+=`<line x1="${ex+a*sd}" y1="${ey+b}" x2="${ex+c*sd}" y2="${ey+d}" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>`;});}
    else if(mood==='tired'){g+=`<path d="M${ex-8},${ey} L${ex+8},${ey}" stroke="#2b2118" stroke-width="3" stroke-linecap="round"/><path d="M${ex-7},${ey} Q${ex},${ey+7} ${ex+7},${ey}" fill="#2b2118"/>`;}
    else {g+=`<ellipse cx="${ex}" cy="${ey}" rx="6.5" ry="7.5" fill="#2b2118"/><circle cx="${ex+2}" cy="${ey-3}" r="2" fill="#fff"/>`;}
  });
  // brows
  const B={happy:['M-32,-24 Q-22,-31 -12,-24','M12,-24 Q22,-31 32,-24'],smile:['M-32,-23 Q-22,-28 -12,-23','M12,-23 Q22,-28 32,-23'],
    neutral:['M-32,-23 L-12,-23','M12,-23 L32,-23'],sad:['M-33,-19 L-12,-28','M12,-28 L33,-19'],cry:['M-33,-18 L-12,-29','M12,-29 L33,-18'],
    unsure:['M-32,-23 L-12,-23','M12,-29 Q22,-34 32,-27'],tired:['M-32,-21 L-12,-21','M12,-21 L32,-21'],sleep:['M-32,-21 L-12,-21','M12,-21 L32,-21'],
    amazed:['M-32,-30 Q-22,-37 -12,-30','M12,-30 Q22,-37 32,-30'],cheeky:['M-32,-26 Q-22,-31 -12,-24','M12,-24 Q22,-31 32,-26']}[mood]||[];
  if(!filter) B.forEach(d=>g+=`<path d="${d}" stroke="${hc}" stroke-width="4" fill="none" stroke-linecap="round"/>`);
  else g+=`<path d="M-34,-30 Q-22,-38 -10,-31" stroke="#5a3a1a" stroke-width="3" fill="none"/><path d="M10,-31 Q22,-38 34,-30" stroke="#5a3a1a" stroke-width="3" fill="none"/>`;
  // cheeks, freckles, pimple
  if(filter) g+=`<ellipse cx="-36" cy="16" rx="14" ry="9" fill="#ff7aa8" opacity=".5"/><ellipse cx="36" cy="16" rx="14" ry="9" fill="#ff7aa8" opacity=".5"/>`;
  else if(['happy','smile','cheeky'].includes(mood)) g+=`<circle cx="-36" cy="16" r="8" fill="#ff8f8f" opacity=".3"/><circle cx="36" cy="16" r="8" fill="#ff8f8f" opacity=".3"/>`;
  if(who==='lena'&&!filter) [[-38,8],[-30,13],[-40,16],[-26,7],[38,8],[30,13],[40,16],[26,7]].forEach(([a,b])=>g+=`<circle cx="${a}" cy="${b}" r="2.2" fill="#c98b5e"/>`);
  if(who==='bella'&&!filter) g+=`<circle cx="38" cy="22" r="4.5" fill="#d2504a"/><path d="M-32,6 Q-22,11 -12,6 M12,6 Q22,11 32,6" stroke="#b58a6a" stroke-width="2" fill="none" opacity=".7"/>`;
  // nose
  g+= filter?`<path d="M-2,14 Q0,17 2,14" stroke="#c0907a" stroke-width="2" fill="none"/>`:`<path d="M-5,12 Q0,20 5,12" stroke="${dark?'#5c351e':'#c0907a'}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  // mouth
  if(filter) g+=`<path d="M-17,29 Q0,45 17,29 Q0,33 -17,29Z" fill="#e2457a"/><path d="M-8,33 Q0,35 8,33" stroke="#fff" stroke-width="2" opacity=".7"/>`;
  else {const M={happy:`<path d="M-21,26 Q0,52 21,26Z" fill="#7a2b2b"/><path d="M-17,27 L17,27 L15,32 L-15,32Z" fill="#fff"/>`,
    smile:`<path d="M-16,28 Q0,42 16,28" stroke="#7a2b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    neutral:`<path d="M-12,33 L12,33" stroke="#7a2b2b" stroke-width="3.5" stroke-linecap="round"/>`,
    sad:`<path d="M-14,37 Q0,26 14,37" stroke="#7a2b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    cry:`<path d="M-15,39 Q0,25 15,39" stroke="#7a2b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M-24,6 q-5,12 0,16 q5,-4 0,-16Z M24,6 q-5,12 0,16 q5,-4 0,-16Z" fill="#6ec6ff"/>`,
    unsure:`<path d="M-14,33 Q-7,28 0,33 Q7,38 14,33" stroke="#7a2b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    tired:`<path d="M-10,34 Q0,31 10,34" stroke="#7a2b2b" stroke-width="3" fill="none"/>`,
    sleep:`<ellipse cx="0" cy="33" rx="5" ry="4" fill="#7a2b2b"/>`,
    amazed:`<ellipse cx="0" cy="33" rx="8" ry="10" fill="#7a2b2b"/>`,
    cheeky:`<path d="M-18,27 Q0,46 18,27Z" fill="#7a2b2b"/><path d="M-8,34 Q0,52 8,34Z" fill="#e8607a"/>`};
    g+=M[mood]||M.smile;}
  return g;
}
function hairBack(who){
  if(who==='lena') return `<path d="M-66,0 Q-80,-86 0,-82 Q80,-86 66,0 L82,112 Q52,126 34,84 L-34,84 Q-52,126 -82,112Z" fill="${HAIR.lena}"/>`;
  if(who==='bella') return `<path d="M-68,0 Q-82,-88 0,-84 Q82,-88 68,0 L86,150 Q52,162 36,90 L-36,90 Q-52,162 -86,150Z" fill="${HAIR.bella}"/>`;
  if(who==='mia'){let g='';for(let a=160;a<=380;a+=18){const r=a*Math.PI/180;g+=`<circle cx="${Math.cos(r)*62}" cy="${Math.sin(r)*62-6}" r="22" fill="${HAIR.mia}"/>`;}
    return g+`<circle cx="-78" cy="-44" r="30" fill="${HAIR.mia}"/><circle cx="78" cy="-44" r="30" fill="${HAIR.mia}"/>`;}
  if(who==='ayla') return `<path d="M-70,0 Q-80,-86 0,-82 Q80,-86 70,0 L72,52 Q60,66 44,56 L-44,56 Q-60,66 -72,52Z" fill="${HAIR.ayla}"/>`;
  if(who==='adult') return `<circle cx="0" cy="-74" r="26" fill="${HAIR.adult}"/><path d="M-62,10 Q-72,-76 0,-72 Q72,-76 62,10 L60,40 L-60,40Z" fill="${HAIR.adult}"/>`;
  return '';
}
function hairFront(who){
  if(who==='lena') return `<path d="M-60,-12 Q-62,-72 0,-64 Q58,-72 60,-12 Q44,-46 14,-42 Q-16,-52 -60,-12Z" fill="${HAIR.lena}"/><path d="M-30,-58 Q-10,-50 0,-40 M10,-58 Q25,-50 32,-38" stroke="#c9a03e" stroke-width="3" fill="none"/>`;
  if(who==='bella') return `<path d="M-60,-6 Q-64,-74 0,-66 Q64,-74 62,-6 Q50,-50 -6,-50 Q-30,-40 -60,-6Z" fill="${HAIR.bella}"/>`;
  if(who==='mia'){let g='';for(let x=-46;x<=46;x+=18)g+=`<circle cx="${x}" cy="${-56+Math.abs(x)*0.25}" r="15" fill="${HAIR.mia}"/>`;return g;}
  if(who==='ayla') return `<path d="M-60,-24 Q-62,-78 0,-72 Q62,-78 60,-24Z" fill="${HAIR.ayla}"/><path d="M-56,-46 Q0,-80 56,-46" stroke="#ff6fa8" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  if(who==='adult') return `<path d="M-58,-14 Q-56,-70 0,-64 Q56,-70 58,-14 Q30,-48 0,-46 Q-30,-48 -58,-14Z" fill="${HAIR.adult}"/>`;
  return '';
}
function body(who){
  const P='M-100,280 L-100,150 Q-98,88 -38,80 L38,80 Q98,88 100,150 L100,280Z';
  if(who==='lena'){const id=uid();const C=['#e63946','#f4a261','#e9c46a','#2a9d8f','#457b9d','#9b5de5'];let s='';for(let i=0;i<12;i++)s+=`<rect x="-110" y="${80+i*17}" width="220" height="17" fill="${C[i%6]}"/>`;
    return `<clipPath id="${id}"><path d="${P}"/></clipPath><g clip-path="url(#${id})">${s}</g>`;}
  if(who==='mia') return `<path d="${P}" fill="#fbfbf7"/><path d="M-50,140 L50,140 L56,280 L-56,280Z" fill="#4a78b5"/><path d="M-50,140 L-60,86 M50,140 L60,86" stroke="#4a78b5" stroke-width="13"/><circle cx="-40" cy="150" r="5" fill="#e0c060"/><circle cx="40" cy="150" r="5" fill="#e0c060"/><rect x="-20" y="170" width="40" height="30" rx="4" fill="#3c669d"/>`;
  if(who==='ayla') return `<path d="${P}" fill="#8e5bd6"/><path d="M0,128 l9,18 20,3 -15,14 4,20 -18,-10 -18,10 4,-20 -15,-14 20,-3Z" fill="#ffd34d"/>`;
  if(who==='bella') return `<path d="${P}" fill="#ef8fb6"/><path d="M-30,80 Q0,110 30,80" fill="none" stroke="#d76e98" stroke-width="4"/>`;
  return `<path d="${P}" fill="#5e9d74"/><path d="M-26,80 L0,110 L26,80" fill="#fff"/>`;
}
function hold(kind,sk){
  if(kind==='ice') return `<path d="M44,120 L80,120 L62,178Z" fill="#d9a05b" stroke="#b07d3e" stroke-width="2"/><circle cx="62" cy="108" r="20" fill="#f6a5c0"/><circle cx="50" cy="176" r="15" fill="${sk}"/>`;
  if(kind==='phone') return `<g transform="rotate(-8 50 150)"><rect x="22" y="100" width="56" height="96" rx="9" fill="#1d1d24"/><rect x="27" y="108" width="46" height="80" rx="4" fill="#9fd3ff"/></g><circle cx="30" cy="180" r="14" fill="${sk}"/><circle cx="78" cy="176" r="14" fill="${sk}"/>`;
  return '';
}
/* a child (or adult). (x,y) = centre of the head */
function kid(o){
  const {x=0,y=0,s=1,who='lena',mood='smile',filter=false,flip=false,hold:h=null,ears=true}=o;
  const sk=SKIN[who];
  return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})">${hairBack(who)}<rect x="-17" y="40" width="34" height="48" rx="10" fill="${sk}"/>${body(who)}${ears?`<circle cx="-57" cy="6" r="11" fill="${sk}"/><circle cx="57" cy="6" r="11" fill="${sk}"/>`:''}<circle cx="0" cy="0" r="58" fill="${sk}"/>${face(who,mood,filter)}${hairFront(who)}${filter?`<path d="M70,-70 l4,10 l10,4 l-10,4 l-4,10 l-4,-10 l-10,-4 l10,-4Z" fill="#ffd34d"/><path d="M-78,-30 l3,7 l7,3 l-7,3 l-3,7 l-3,-7 l-7,-3 l7,-3Z" fill="#ffd34d"/>`:''}${hold(h,sk)}</g>`;
}
/* head-and-shoulders portrait that fills a box */
function portrait(x,y,w,h,o){return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="-100 -112 200 210" preserveAspectRatio="xMidYMid slice">${kid(o)}</svg>`;}
function headIcon(who,mood,filter=false){return `<svg viewBox="-80 -95 160 160">${hairBack(who)}<circle cx="0" cy="0" r="58" fill="${SKIN[who]}"/>${face(who,mood,filter)}${hairFront(who)}</svg>`;}
const headAt=(who,x,y,sz,mood='smile',filter=false)=>headIcon(who,mood,filter).replace('<svg',`<svg x="${x}" y="${y}" width="${sz}" height="${sz}"`);
function phone(x,y,w,h,inner){const W=w-14,H=h-30;return `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" rx="18" fill="#1d1d24"/><rect x="7" y="15" width="${W}" height="${H}" rx="8" fill="#fff"/><svg x="7" y="15" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${typeof inner==='function'?inner(W,H):inner}</svg><rect x="${w/2-14}" y="5" width="28" height="5" rx="2.5" fill="#444"/></g>`;}
const post=(o,likes,extra='')=>(W,H)=>`<rect width="${W}" height="${H}" fill="#fdeef4"/>${portrait(6,6,W-12,H-52,o)}<rect y="${H-44}" width="${W}" height="44" fill="#fff"/>${emo('❤️',26,H-22,24)}<text x="44" y="${H-21}" font-size="22" font-weight="800" fill="#d9384a" dominant-baseline="central">${likes}</text>${extra}`;
function bubble(x,y,w,h,content,tx,ty,thought){
  if(thought) return `<g><ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2}" ry="${h/2}" fill="#fff" stroke="#333" stroke-width="3"/><circle cx="${tx}" cy="${ty}" r="7" fill="#fff" stroke="#333" stroke-width="2.5"/><circle cx="${(tx+x+w/2)/2}" cy="${(ty+y+h)/2}" r="11" fill="#fff" stroke="#333" stroke-width="2.5"/>${content}</g>`;
  return `<g><path d="M${x+20},${y} h${w-40} q20,0 20,20 v${h-40} q0,20 -20,20 H${Math.min(x+w-20,tx+18)} L${tx},${ty} L${Math.max(x+20,tx-6)},${y+h} H${x+20} q-20,0 -20,-20 v-${h-40} q0,-20 20,-20Z" fill="#fff" stroke="#333" stroke-width="3"/>${content}</g>`;
}

const FONT='font-family="ui-rounded, system-ui, -apple-system, sans-serif"';
const tlen=t=>[...t].reduce((n,c)=>n+(c.codePointAt(0)>0x2000?1.7:1),0);
function cap(t){const w=Math.round(tlen(t)*19.5+44);return `<g><rect x="14" y="12" rx="14" width="${w}" height="58" fill="#fff6c8" stroke="#2c2a1e" stroke-width="3"/><text x="${14+w/2}" y="42" font-size="30" font-weight="900" fill="#2c2a1e" text-anchor="middle" dominant-baseline="central" ${FONT}>${t}</text></g>`;}
function say(x,y,t,tx,ty,o={}){const fs=o.fs||28;const w=o.w||Math.round(tlen(t)*fs*.6+(o.think?80:44));const h=o.h||(o.think?86:64);
  return bubble(x,y,w,h,`<text x="${x+w/2}" y="${y+h/2+1}" font-size="${fs}" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="#222" ${FONT}>${t}</text>`,tx,ty,o.think);}
const think=(x,y,t,tx,ty,o={})=>say(x,y,t,tx,ty,{...o,think:true});
/* a chat bubble with a small face in front, for messages on the phone or from far away */
function msg(x,y,who,t,o={}){const fs=o.fs||26;const w=Math.round(tlen(t)*fs*.6+90);return `<g><rect x="${x}" y="${y}" width="${w}" height="62" rx="20" fill="#fff" stroke="#333" stroke-width="3"/>${headAt(who,x+6,y+5,52,'smile')}<text x="${x+66}" y="${y+32}" font-size="${fs}" font-weight="800" dominant-baseline="central" fill="#222" ${FONT}>${t}</text></g>`;}

/* ---------- top bar ---------- */
const $=id=>document.getElementById(id);
const arrow=d=>d>0?'⬆️':d<0?'⬇️':'';
function drawTop(s){
  $('week').innerHTML=DAYS.map((d,i)=>`<span class="${i===ST.day&&s.type!=='start'&&s.type!=='review'?'now':''} ${i<ST.day||s.type==='review'?'done':''}">${d}</span>`).join('');
  const t=$('turn');
  if(s.who){t.hidden=false;t.className='turn '+s.who+(s.type==='decide'?' pulse':'');t.innerHTML=headIcon(s.who,'smile')+`<span>${{lena:'Lena',mia:'Mia',ayla:'Ayla'}[s.who]}</span>`;}
  else t.hidden=true;
  const d=last&&cur===last.at?last.d:{};
  const on=ST.herz, col=on>=7?'#3f9b4a':on>=4?'#e0a526':'#d14b3c';
  $('meter').innerHTML=headIcon('lena',moodOf(ST.herz)).replace('<svg','<svg class="face"')+`<div class="bar" aria-label="Lena ${ST.herz} von 10">${Array.from({length:10},(_,i)=>`<i style="${i<on?`background:${col}`:''}"></i>`).join('')}</div><span class="delta">${arrow(d.herz)}</span>`;
  const op=v=>[.12,.35,.62,1][v], gs=v=>[1,1,.6,0][v];
  const fr=(w,v,dv)=>`<span class="fr${dv<0?' lost':''}">${headIcon(w,v>=2?'smile':v===1?'unsure':'sad').replace('<svg',`<svg style="opacity:${op(v)};filter:grayscale(${gs(v)})"`)}${dv<0?'<b>💔</b>':''}</span>`;
  const dm=d.mia||0, da=d.ayla||0;
  $('real').innerHTML=`<span>🤝</span>${fr('mia',ST.mia,dm)}${fr('ayla',ST.ayla,da)}<span class="ar">${arrow(d.real)}</span>`;
  $('online').innerHTML=`<span>📱</span><span>👥 ${ST.follow}</span><span>❤️ ${ST.likes}</span><span class="ar">${arrow(d.online)}</span>`;
}

/* ---------- flow ---------- */
function snapshot(){return {cur,st:JSON.parse(JSON.stringify(ST)),last};}
function go(id){hist.push(snapshot());cur=id;enter();render();}
function back(){const h=hist.pop();if(!h)return;cur=h.cur;ST=h.st;last=h.last;render();}
function restart(){hist.length=0;ST=JSON.parse(JSON.stringify(START));cur='start';last=null;render();}
const snap=()=>({herz:ST.herz,likes:ST.likes,real:real(),follow:ST.follow,mia:ST.mia,ayla:ST.ayla});
function enter(){const s=S[cur];
  if(s.type==='day'){ if(s.day>0) ST.log[s.day-1]=snap(); ST.day=s.day; }
  if(s.ending) ST.log[6]=snap();
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function choose(c,k){
  hist.push(snapshot());
  const rid='r_'+cur+'_'+k, b=snap();
  const e=c.eff;
  ST.herz=clamp(ST.herz+(e.herz||0),0,10); ST.mia=clamp(ST.mia+(e.mia||0),0,3); ST.ayla=clamp(ST.ayla+(e.ayla||0),0,3);
  ST.likes+=e.likes||0; ST.follow+=e.follow||0; if(e.fake)ST.fake=true; if(e.fuchs)ST.fuchs=true;
  S[rid]={type:'scene',draw:c.res,next:c.next};cur=rid;
  last={at:rid,d:{herz:ST.herz-b.herz,real:real()-b.real,mia:ST.mia-b.mia,ayla:ST.ayla-b.ayla,online:(ST.follow-b.follow)+(ST.likes-b.likes)}};
  render();
}
function navBar(nextId,middle){
  const n=document.createElement('div');n.className='nav';
  const b=document.createElement('button');b.className='arrow back';b.textContent='◀';b.setAttribute('aria-label','Zurück');b.disabled=!hist.length;b.onclick=back;
  const f=document.createElement('button');f.className='arrow';f.textContent='▶';f.setAttribute('aria-label','Weiter');if(nextId)f.onclick=()=>go(nextId);else f.disabled=true;
  let m=middle; if(!m){m=document.createElement('button');m.className='restart';m.textContent='⟲';m.setAttribute('aria-label','Von vorn');m.onclick=restart;}
  n.append(b,m,f);return n;
}
function feelRow(){const r=document.createElement('div');r.className='feel';['😊','🙂','😐','☹️','😢','😨'].forEach(e=>{const b=document.createElement('button');b.textContent=e;b.setAttribute('aria-pressed','false');b.onclick=()=>{r.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');};r.appendChild(b);});return r;}

function render(){
  const s=S[cur], st=$('stage'), bt=$('bottom');
  st.innerHTML='';bt.innerHTML='';drawTop(s);
  if(s.type==='start'){
    st.innerHTML=`<div class="startbox"><svg viewBox="0 0 800 330">${BG.park.replace('height="500"','height="330"')}${LENA({x:250,y:180,s:.8,mood:'happy'})}${kid({x:410,y:180,who:'mia',mood:'happy',s:.8,flip:true})}${kid({x:570,y:180,who:'ayla',mood:'happy',s:.8,flip:true})}</svg><h1>Echte Freundinnen</h1><div class="pair" aria-label="Zu zweit spielen">🧒🧒 📱</div><p class="small">Für die Lehrkraft: Eine Woche mit Lena, Mia und Ayla, 13 Entscheidungen und 3 Aufgaben. Partnerarbeit: ein iPad pro Paar, die beiden treffen alle Entscheidungen gemeinsam. Das Gesicht oben zeigt, in wessen Rolle sie gerade entscheiden (meist Lena, manchmal Mia oder Ayla). Danach vergleicht die Klasse die Enden im Plenum. Oben sieht man, wie es Lena geht, wie nah ihre echten Freundinnen sind und wie viele Online-Freunde und Likes sie hat. Das Spiel speichert nichts.</p></div>`;
    const p=document.createElement('button');p.className='arrow';p.style.width='140px';p.textContent='▶';p.setAttribute('aria-label','Start');p.onclick=()=>go('d0');bt.appendChild(p);return;}
  if(s.type==='day'){
    st.innerHTML=`<div class="daycard"><span class="sun">${s.day===6?'☀️🌈':'☀️'}</span><span class="d">${DAYS[s.day]}</span><span class="full">${DAYFULL[s.day]}</span></div>`;
    bt.appendChild(navBar(s.next));return;}
  if(s.type==='scene'){st.innerHTML=scene(s.draw());bt.appendChild(navBar(s.next));return;}
  if(s.type==='feel'){st.innerHTML=scene(s.draw());bt.appendChild(navBar(s.next,feelRow()));return;}
  if(s.type==='decide'){
    st.innerHTML=scene(s.draw());
    const bk=document.createElement('button');bk.className='arrow back';bk.textContent='◀';bk.setAttribute('aria-label','Zurück');bk.onclick=back;bk.disabled=!hist.length;
    const c=document.createElement('div');c.className='cards';
    s.cards.forEach((cd,k)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span class="ic" aria-hidden="true">${cd.ic}</span><span class="w">${cd.w}</span>`;b.onclick=()=>choose(cd,k);c.appendChild(b);});
    bt.append(bk,c);return;}
  if(s.type==='detektiv'){
    const spots=[{x:0,y:-4,rx:46,ry:20},{x:38,y:22,rx:13,ry:13},{x:0,y:33,rx:20,ry:13}];const found=new Set();
    const ph=(filter,hot)=>`<svg x="0" y="0" width="100%" height="100%" viewBox="-100 -112 200 210">${kid({who:'bella',mood:'smile',filter})}${spots.map((p,i)=>`<ellipse data-i="${i}" class="${hot?'hot':'mark'}" cx="${p.x}" cy="${p.y}" rx="${p.rx}" ry="${p.ry}" fill="${hot?'rgba(0,0,0,0)':'none'}" stroke="none" stroke-width="5" ${hot?'style="cursor:pointer"':''}/>`).join('')}</svg>`;
    st.innerHTML=`<svg class="scene" viewBox="0 0 800 500" role="img" aria-label="Echt und Filter vergleichen"><rect width="800" height="500" fill="#fff7e0"/>
      <g transform="translate(80 80)"><rect width="270" height="410" rx="22" fill="#1d1d24"/><rect x="10" y="18" width="250" height="374" rx="10" fill="#fdeef4"/><svg x="10" y="18" width="250" height="374">${ph(false,false)}</svg></g>
      <g transform="translate(450 80)"><rect width="270" height="410" rx="22" fill="#1d1d24"/><rect x="10" y="18" width="250" height="374" rx="10" fill="#fdeef4"/><svg x="10" y="18" width="250" height="374">${ph(true,true)}</svg></g>
      ${cap('Echt oder Filter?')}${tag(215,90,'echt 📷')}${tag(585,90,'Filter 🎭')}${emo('↔️',400,280,50)}</svg>`;
    const cnt=document.createElement('span');cnt.className='found';
    const upd=()=>{cnt.textContent='🔍 '+[0,1,2].map(i=>i<found.size?'🟡':'⚪').join('');};upd();
    st.querySelectorAll('.hot').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.i;found.add(i);
      st.querySelectorAll(`ellipse[data-i="${i}"]`).forEach(e=>e.setAttribute('stroke','#ffb703'));upd();}));
    bt.appendChild(navBar(s.next,cnt));return;}
  if(s.type==='sort'){
    const box=document.createElement('div');box.className='sortbox';
    box.innerHTML=`<div class="htitle">${s.title}</div>`;
    const wrap=document.createElement('div');wrap.className='sortlist';
    s.items().forEach(c=>{const d=document.createElement('div');d.className='cmt';
      d.innerHTML=`<span class="av">${c.av}</span><span class="tx">${c.tx}</span><span class="bt">${s.opts.map(o=>`<button aria-label="${o.l}" data-k="${o.k}">${o.ic}</button>`).join('')}</span>`;
      d.querySelectorAll('.bt button').forEach(b=>b.onclick=()=>{if(b.dataset.k===c.k){d.classList.remove('no');d.classList.add('ok');d.querySelector('.bt').innerHTML=`<span style="font-size:2.2rem">${b.textContent}</span>`;}else{d.classList.remove('no');void d.offsetWidth;d.classList.add('no');}});
      wrap.appendChild(d);});
    box.appendChild(wrap);st.appendChild(box);bt.appendChild(navBar(s.next));return;}
  if(s.type==='review'){
    const maxL=Math.max(1,...ST.log.map(l=>l?l.likes:0));
    const col=h=>h>=7?'var(--good)':h>=4?'#e0a526':'var(--bad)';
    const row=(lab,fn)=>`<span class="lab">${lab}</span>`+DAYS.map((d,i)=>{const l=ST.log[i];return l?fn(l):'<span></span>';}).join('');
    let h=`<div class="review" role="img" aria-label="Lenas Woche"><span></span>${DAYS.map(d=>`<span class="dn">${d}</span>`).join('')}`;
    h+=row(headIcon('lena','smile').replace('<svg','<svg style="width:44px;height:44px"'),l=>`<span class="fc">${headIcon('lena',moodOf(l.herz))}</span>`);
    h+=row('📶',l=>`<span class="lk"><b style="height:${Math.max(4,l.herz/10*80)}px;background:${col(l.herz)}"></b></span>`);
    h+=row('🤝',l=>`<span class="lk"><b style="height:${Math.max(4,l.real/6*80)}px;background:var(--mia)"></b></span>`);
    h+=row('❤️',l=>`<span class="lk"><small>${l.likes}</small><b style="height:${Math.max(3,l.likes/maxL*70)}px"></b></span>`)+'</div>';
    st.innerHTML=h;
    const c=document.createElement('div');c.className='cards';
    const r=document.createElement('button');r.className='card';r.innerHTML='<span class="ic">⟲</span><span class="w">Nochmal</span>';r.onclick=restart;
    const bk=document.createElement('button');bk.className='arrow back';bk.textContent='◀';bk.setAttribute('aria-label','Zurück');bk.onclick=back;
    c.appendChild(r);bt.append(bk,c);return;}
}
document.addEventListener('keydown',e=>{const s=S[cur];if(e.key==='ArrowRight'&&s.next&&s.type!=='decide')go(s.next);if(e.key==='ArrowLeft')back();});
render();
</script>
